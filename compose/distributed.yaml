# Skeleton only: Hadoop services are not started yet.
x-node: &node
  image: hadoop-base:v0.1
  platform: linux/amd64
  init: true
  stop_grace_period: 30s
  env_file:
    - ../.development
  working_dir: /workspace
  command: ["sleep", "infinity"]
  networks:
    - hadoop

services:
  master:
    <<: *node
    hostname: master
    volumes:
      - ..:/workspace
      - master-data:/var/lib/hadoop

  worker1:
    <<: *node
    hostname: worker1
    volumes:
      - ..:/workspace
      - worker1-data:/var/lib/hadoop

  worker2:
    <<: *node
    hostname: worker2
    volumes:
      - ..:/workspace
      - worker2-data:/var/lib/hadoop

networks:
  hadoop:

volumes:
  master-data:
  worker1-data:
  worker2-data: